<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body { font-family: Tahoma; padding: 20px; background: #f5f5f5; margin: 0; }
.box { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
.box h2 { margin-top: 0; }
input, select { padding: 8px; margin: 4px; border: 1px solid #ccc; border-radius: 4px; width: 210px; font-family: Tahoma; }
button { padding: 10px 20px; background: #007bff; color: #fff; border: 0; border-radius: 4px; cursor: pointer; font-family: Tahoma; }
button.danger { background: #dc3545; }
button.success { background: #28a745; }
button.small { padding: 5px 10px; font-size: 12px; }
table { width: 100%; border-collapse: collapse; background: #fff; }
th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: right; }
th { background: #f0f0f0; }
.photo-preview { width: 80px; height: 100px; object-fit: cover; border: 1px solid #ccc; border-radius: 4px; margin-top: 5px; display: none; }
.note { color: #888; font-size: 12px; margin-top: 10px; }
#view-area input { width: 100%; margin: 0; box-sizing: border-box; }
</style>
</head>
<body>

<div class="box">
  <h2>ثبت رکورد جدید</h2>
  <form id="form">
    <input name="name" id="inp-name" placeholder="نام (فارسی)" required>
    <input name="english_name" id="inp-english_name" placeholder="نام انگلیسی" style="direction: ltr; text-align: left;" required>
    <input name="family" id="inp-family" placeholder="نام خانوادگی (فارسی)" required>
    <input name="english_family" id="inp-english_family" placeholder="نام خانوادگی انگلیسی" style="direction: ltr; text-align: left;" required>
    <input name="national_id" placeholder="کد ملی" required>
    <input name="father_name" placeholder="نام پدر">
    <input name="birth_date" placeholder="تاریخ تولد">
    <input name="letter_number" id="inp-letter_number" placeholder="شماره نامه">
    <input name="education" placeholder="تحصیلات">
    <select name="gender"><option value="مرد">مرد</option><option value="زن">زن</option></select>
    <input name="shenasname" placeholder="شماره شناسنامه">
    <input name="address" placeholder="آدرس">
    <input name="postal_code" placeholder="کد پستی">
    <input name="phone" placeholder="تلفن">
    <input name="bank_account" id="inp-bank_account" placeholder="شماره حساب">
    <input name="sheba" placeholder="شبا">
    <input name="bank_branch" placeholder="نام شعبه">
    <input name="account_owner" placeholder="صاحب حساب">
    <input name="blood_type" placeholder="گروه خونی">
    <input name="driving_ability" placeholder="توانایی رانندگی">
    <input name="doctor_name" placeholder="نام پزشک">
    <input name="doctor_date" placeholder="تاریخ مراجعه پزشک">
    <input name="medical_code" placeholder="کد نظام پزشکی">
    <select name="license_type" required>
      <option value="پایه سوم">گواهینامه پایه سوم</option>
      <option value="موتورسیکلت">گواهینامه موتورسیکلت</option>
    </select>
    <input name="created_at" type="date" title="تاریخ ثبت رکورد">
    <br>
    <label>عکس متقاضی:</label>
    <input type="file" id="photo" accept="image/*">
    <br>
    <img id="preview" class="photo-preview">
    <br><br>
    <button type="submit" class="success">ثبت رکورد</button>
  </form>
</div>

<div class="box">
  <h2>لیست رکوردها</h2>
  <table id="list">
    <thead><tr><th>ID</th><th>نام</th><th>کد ملی</th><th>نوع</th><th>کد رهگیری</th><th>عملیات</th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="note" id="list-note">در حال بارگذاری...</div>
</div>

<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);overflow:auto;z-index:10">
  <div style="background:#fff;margin:20px auto;max-width:700px;border-radius:8px;padding:20px">
    <div id="view-area" style="padding:15px;background:#fff"></div>
    <div style="margin-top:15px">
      <button id="btn-save" class="success">ذخیره ویرایش</button>
      <button id="btn-pdf">دانلود PDF</button>
      <button id="btn-close" class="danger">بستن</button>
    </div>
  </div>
</div>

<script>
const API_URL = "https://kardex.asnadir361.workers.dev";

let photoBase64 = '';
let current = null;
const photoInput = document.getElementById('photo');
const preview = document.getElementById('preview');
const note = document.getElementById('list-note');

const LABELS = {
  name:'نام', family:'نام خانوادگی', english_name:'نام انگلیسی', english_family:'نام خانوادگی انگلیسی',
  national_id:'کد ملی', father_name:'نام پدر', birth_date:'تاریخ تولد', letter_number:'شماره نامه',
  education:'تحصیلات', gender:'جنسیت', shenasname:'شماره شناسنامه', address:'آدرس',
  postal_code:'کد پستی', phone:'تلفن', bank_account:'شماره حساب', sheba:'شبا',
  bank_branch:'نام شعبه', account_owner:'صاحب حساب', blood_type:'گروه خونی',
  driving_ability:'توانایی رانندگی', doctor_name:'نام پزشک', doctor_date:'تاریخ مراجعه پزشک',
  medical_code:'کد نظام پزشکی', license_type:'نوع گواهینامه', created_at:'تاریخ ثبت',
  tracking_code:'کد رهگیری'
};

function randomize() {
  document.getElementById('inp-letter_number').value = Math.floor(100000 + Math.random() * 900000);
  document.getElementById('inp-bank_account').value = Math.floor(10000000 + Math.random() * 90000000);
}
randomize();

const faToEnMap = {
  'آ':'a','ا':'a','ب':'b','پ':'p','ت':'t','ث':'s','ج':'j','چ':'ch','ح':'h','خ':'kh',
  'د':'d','ذ':'z','ر':'r','ز':'z','ژ':'zh','س':'s','ش':'sh','ص':'s','ض':'z','ط':'t',
  'ظ':'z','ع':'a','غ':'gh','ف':'f','ق':'gh','ک':'k','گ':'g','ل':'l','م':'m','ن':'n',
  'و':'v','ه':'h','ی':'y',' ':' ','‌':''
};
function toEnglish(s) {
  return s.split('').map(c => faToEnMap[c] ?? c).join('').toUpperCase();
}
document.getElementById('inp-name').addEventListener('input', e => {
  document.getElementById('inp-english_name').value = toEnglish(e.target.value);
});
document.getElementById('inp-family').addEventListener('input', e => {
  document.getElementById('inp-english_family').value = toEnglish(e.target.value);
});

photoInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const max = 600;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = img.width * scale;
      c.height = img.height * scale;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      photoBase64 = c.toDataURL('image/jpeg', 0.8);
      preview.src = photoBase64;
      preview.style.display = 'block';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  data.photo_base64 = photoBase64;
  if (data.created_at) data.created_at = new Date(data.created_at).toISOString();
  try {
    const res = await fetch(API_URL + '/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const out = await res.json();
    if (res.ok && out.success) {
      alert('✅ ثبت شد. کد رهگیری: ' + out.tracking_code);
      e.target.reset();
      preview.style.display = 'none';
      photoBase64 = '';
      randomize();
      loadList();
    } else {
      alert('❌ خطا در ثبت: ' + (out.error || res.status));
    }
  } catch (err) {
    alert('❌ اتصال به سرور برقرار نشد: ' + err.message);
  }
});

async function loadList() {
  try {
    const res = await fetch(API_URL + '/api/applicants');
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error(data.error || 'پاسخ نامعتبر');
    const tbody = document.querySelector('#list tbody');
    tbody.innerHTML = '';
    data.forEach(d => {
      const tr = document.createElement('tr');
      [d.id, d.name + ' ' + d.family, d.national_id, d.license_type, d.tracking_code].forEach(v => {
        const td = document.createElement('td');
        td.textContent = v ?? '';
        tr.appendChild(td);
      });
      const td = document.createElement('td');
      const view = document.createElement('button');
      view.className = 'small';
      view.textContent = '👁 مشاهده';
      view.onclick = () => openRecord(d.id);
      const del = document.createElement('button');
      del.className = 'small danger';
      del.textContent = '🗑️';
      del.onclick = () => removeItem(d.id);
      td.append(view, ' ', del);
      tr.appendChild(td);
      tbody.appendChild(tr);
    });
    note.textContent = data.length + ' رکورد ثبت شده';
  } catch (err) {
    note.textContent = '❌ خطا در اتصال: ' + err.message;
  }
}

async function openRecord(id) {
  const res = await fetch(API_URL + '/api/applicant/' + id);
  const rec = await res.json();
  if (rec.error) { alert(rec.error); return; }
  current = rec;
  const area = document.getElementById('view-area');
  area.innerHTML = '';
  if (rec.photo_base64) {
    const img = document.createElement('img');
    img.src = rec.photo_base64;
    img.style.cssText = 'width:100px;height:130px;object-fit:cover;border:1px solid #ccc;display:block;margin-bottom:10px';
    area.appendChild(img);
  }
  Object.keys(LABELS).forEach(k => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;margin:4px 0';
    const lb = document.createElement('label');
    lb.style.cssText = 'width:140px;flex-shrink:0;font-size:13px;color:#555';
    lb.textContent = LABELS[k];
    const inp = document.createElement('input');
    inp.dataset.key = k;
    inp.value = rec[k] ?? '';
    if (k === 'tracking_code') inp.readOnly = true;
    row.append(lb, inp);
    area.appendChild(row);
  });
  document.getElementById('modal').style.display = 'block';
}

document.getElementById('btn-close').onclick = () =>
  document.getElementById('modal').style.display = 'none';

document.getElementById('btn-save').onclick = async () => {
  const body = {};
  document.querySelectorAll('#view-area input').forEach(i => body[i.dataset.key] = i.value);
  const res = await fetch(API_URL + '/api/applicant/' + current.id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const out = await res.json();
  if (out.success) { alert('✅ ویرایش شد'); loadList(); }
  else alert('❌ ' + (out.error || 'خطا'));
};

document.getElementById('btn-pdf').onclick = async () => {
  const canvas = await html2canvas(document.getElementById('view-area'), { scale: 2, useCORS: true });
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  const w = 190;
  const h = canvas.height * w / canvas.width;
  pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 10, 10, w, h);
  pdf.save('applicant-' + current.id + '.pdf');
};

async function removeItem(id) {
  if (!confirm('حذف شود؟')) return;
  await fetch(API_URL + '/api/applicant/' + id, { method: 'DELETE' });
  loadList();
}

loadList();
</script>
</body>
</html>
